name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pacificcommunity/tuna-flow-private:v2.7@sha256:4fee4c40cb6439ff920b1dd233a84bf19d5cc0e37278c99ceff3fd79cb9c8852
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled R packages
        shell: bash
        run: |
          Rscript ci/verify-runtime.R
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          command -v Rscript
          python3 -m unittest discover -s tests -p "test_*.py" -v
          python3 ci/verify-preserved-files.py
          test -e "$GITHUB_WORKSPACE/.git"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --exit-code
      - name: Verify test fixture isolation
        if: always()
        run: Rscript ci/verify-runtime.R
